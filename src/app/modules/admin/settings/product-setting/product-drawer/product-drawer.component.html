<div class="h-full flex flex-col bg-white dark:bg-gray-900">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center justify-between mb-3">
            <div>
                <h3
                    class="text-lg font-semibold text-gray-900 dark:text-gray-100"
                >
                    Product Actions
                </h3>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
                    Manage your product operations
                </p>
            </div>
            <button
                mat-icon-button
                class="text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300 transition-colors -mr-2"
                (click)="closeDrawer.emit()"
                aria-label="Close panel"
            >
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto">
        <div class="p-6 space-y-6">
            <!-- Quick Actions Section -->
            <div>
                <h4
                    class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3"
                >
                    Quick Actions
                </h4>

                <!-- Create Product Button (Main Action) -->
                <button
                    mat-raised-button
                    color="primary"
                    class="w-full flex items-center justify-center py-3 px-4 rounded-lg mb-3 shadow-sm hover:shadow transition-shadow"
                    (click)="onAddProduct()"
                >
                    <mat-icon class="mr-2 !text-xl">add_circle</mat-icon>
                    <span class="font-medium text-sm">Create Product</span>
                </button>
            </div>
        </div>
    </div>
</div>
